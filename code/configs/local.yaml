  S28K4: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3"],
          env: {PYTHONPATH: <sglang-overlay>, SGLANG_DRAFT_LM_HEAD_QUANT: int4, SGLANG_SPLITKV_VERIFY_ON_CUDA: "1"}}
