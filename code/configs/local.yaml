# Local harness validation only (RTX 5070 Laptop 8 GB, WSL 7 GB RAM). Numbers are never
# compared with L4/H100. Qwen3.5-2B has the same MTP architecture (1 MTP layer) and tokenizer as 4B.
name: local
python: <local-path>   # existing SGLang 0.5.21 venv, unmodified
model: <local-path>
model_revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
env:  # WSL-only toolkit link dir (pip nvidia/cu13 + libcuda link) from gdn_bcg_lab; never used on EC2
  CUDA_HOME: <local-path>
  PATH: <local-path>
  SGLANG_CACHE_DIR: .cache/sglang
  FLASHINFER_WORKSPACE_BASE: .cache
  HF_HUB_OFFLINE: "1"
  # FlashInfer JIT on WSL: nvcc 13.4 vs CUDA 13.0 headers (unsupported override, from norm_lab) + libcuda link dir
  FLASHINFER_EXTRA_CUDAFLAGS: -DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK
  FLASHINFER_EXTRA_LDFLAGS: -L<local-path>
port: 30200
min_free_mib: 7000          # VRAM gate before every launch (0.85 x 8150 MiB static pool)
startup_timeout_s: 900
server_common: [--attention-backend, triton, --context-length, "9216", --mem-fraction-static, "0.85",
                --max-running-requests, "2", --max-mamba-cache-size, "8"]
variants:
  A: []                                         # stock, no speculation
  B: [--speculative-algorithm, NEXTN, --speculative-num-steps, "3",
      --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "4"]   # official Qwen3.5 MTP flags
  # stock step sweep (topk 1, draft tokens = steps + 1); B is steps 3
  S1: [--speculative-algorithm, NEXTN, --speculative-num-steps, "1", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "2"]
  S2: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3"]
  S4: [--speculative-algorithm, NEXTN, --speculative-num-steps, "4", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "5"]
  S5: [--speculative-algorithm, NEXTN, --speculative-num-steps, "5", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "6"]
  S2F: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3",
        --attention-backend, flashinfer]   # SGLang's default backend on SM120/SM89 (overrides server_common triton)
  AF: [--attention-backend, flashinfer]
  S1F: [--speculative-algorithm, NEXTN, --speculative-num-steps, "1", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "2", --attention-backend, flashinfer]
  S3F: [--speculative-algorithm, NEXTN, --speculative-num-steps, "3", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "4", --attention-backend, flashinfer]
  # Stage 1: draft-only FP8 Marlin lm_head (source overlay <sglang-overlay>, branch fp8-draft-head)
  S2Fo: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3", --attention-backend, flashinfer],
         env: {PYTHONPATH: <sglang-overlay>}}   # overlay, patch inactive (parity control)
  S2F8: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3", --attention-backend, flashinfer],
         env: {PYTHONPATH: <sglang-overlay>, SGLANG_DRAFT_LM_HEAD_QUANT: fp8}}
  S3F8: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "3", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "4", --attention-backend, flashinfer],
         env: {PYTHONPATH: <sglang-overlay>, SGLANG_DRAFT_LM_HEAD_QUANT: fp8}}
  S2o: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3"],
        env: {PYTHONPATH: <sglang-overlay>}}   # Triton (strongest stock), overlay, patch off
  S28: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3"],
        env: {PYTHONPATH: <sglang-overlay>, SGLANG_DRAFT_LM_HEAD_QUANT: fp8}}
  S38: {flags: [--speculative-algorithm, NEXTN, --speculative-num-steps, "3", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "4"],
        env: {PYTHONPATH: <sglang-overlay>, SGLANG_DRAFT_LM_HEAD_QUANT: fp8}}
  # Stage 2 probe: stock hybrid attention: verify (+draft extend) on FlashInfer prefill path, decode on Triton
  S2H: [--speculative-algorithm, NEXTN, --speculative-num-steps, "2", --speculative-eagle-topk, "1", --speculative-num-draft-tokens, "3",
