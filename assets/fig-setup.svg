<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 296" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"><title id="t">Experiment setup: prompts, the speculative round inside the SGLang server, and the outputs</title><desc id="d">Fixed prompts enter a local SGLang server in WSL2 on the RTX 5070. Each round drafts tokens, verifies them with the BF16 target, commits the accepted prefix and schedules the next round. Benchmark and profiler outputs feed the results. Badges mark the four findings.</desc><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d9dedf" stroke-width="2.4"/></pattern></defs><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52626b"/></marker></defs><rect x="14.0" y="114.0" width="128.0" height="52.0" rx="8" fill="#ffffff" stroke="#9aa4aa" stroke-width="1.2"></rect><text x="78.0" y="145.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Fixed prompts</text><line x1="142" y1="140" x2="165" y2="140" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><rect x="166.0" y="12.0" width="342.0" height="272.0" rx="10" fill="#fbfbfa" stroke="#9aa4aa" stroke-width="1.2" stroke-dasharray="5 4"></rect><text x="180.0" y="36.0" font-size="13.5" fill="#1e2b34" text-anchor="start" font-weight="400" font-family="Georgia,'Times New Roman',serif">SGLang server</text><text x="494.0" y="36.0" font-size="11" fill="#7d8a90" text-anchor="end" font-weight="400">local · WSL2 · RTX 5070</text><rect x="180.0" y="52.0" width="148.0" height="64.0" rx="8" fill="#fdeee7" stroke="#e07a4f" stroke-width="1.2"></rect><text x="254.0" y="78.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Draft (MTP)</text><rect x="221.0" y="88.0" width="66.0" height="17.0" rx="8.5" fill="#b9521f"><title>Finding 1 from the first trace</title></rect><text x="254.0" y="100.5" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="400">Finding 1</text><rect x="352.0" y="52.0" width="148.0" height="64.0" rx="8" fill="#e7eff9" stroke="#5b8fd0" stroke-width="1.2"></rect><text x="426.0" y="78.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Target verify</text><rect x="393.0" y="88.0" width="66.0" height="17.0" rx="8.5" fill="#24599e"><title>Finding 2 from the first trace</title></rect><text x="426.0" y="100.5" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="400">Finding 2</text><rect x="352.0" y="152.0" width="148.0" height="64.0" rx="8" fill="#ffffff" stroke="#9aa4aa" stroke-width="1.2"></rect><text x="426.0" y="189.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Accept and commit</text><rect x="180.0" y="152.0" width="148.0" height="64.0" rx="8" fill="#fcf7dc" stroke="#d6bd4f" stroke-width="1.2"></rect><text x="254.0" y="178.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Scheduler (CPU)</text><rect x="221.0" y="188.0" width="66.0" height="17.0" rx="8.5" fill="#806a12"><title>Finding 4 from the first trace</title></rect><text x="254.0" y="200.5" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="400">Finding 4</text><line x1="328" y1="84" x2="351" y2="84" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><line x1="426" y1="116" x2="426" y2="151" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><line x1="352" y1="184" x2="329" y2="184" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><line x1="254" y1="152" x2="254" y2="117" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><text x="340.0" y="131.0" font-size="11" fill="#7d8a90" text-anchor="middle" font-weight="400">one speculative</text><text x="340.0" y="144.0" font-size="11" fill="#7d8a90" text-anchor="middle" font-weight="400">round</text><rect x="180.0" y="228.0" width="320.0" height="44.0" rx="8" fill="#efecf6" stroke="#8c7bb8" stroke-width="1.2"></rect><text x="192.0" y="246.0" font-size="13.5" fill="#1e2b34" text-anchor="start" font-weight="400" font-family="Georgia,'Times New Roman',serif">GPU memory (8 GB)</text><text x="192.0" y="262.0" font-size="11" fill="#52626b" text-anchor="start" font-weight="400">weights  ·  KV cache  ·  recurrent state</text><rect x="419.0" y="241.5" width="66.0" height="17.0" rx="8.5" fill="#5f4f91"><title>Finding 3 from the first trace</title></rect><text x="452.0" y="254.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="400">Finding 3</text><line x1="508" y1="66" x2="525" y2="66" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><rect x="526.0" y="40.0" width="140.0" height="52.0" rx="8" fill="#ffffff" stroke="#9aa4aa" stroke-width="1.2"></rect><text x="596.0" y="71.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Benchmark</text><line x1="596" y1="92" x2="596" y2="119" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><rect x="526.0" y="120.0" width="140.0" height="52.0" rx="8" fill="#ffffff" stroke="#9aa4aa" stroke-width="1.2"></rect><text x="596.0" y="151.0" font-size="13.5" fill="#1e2b34" text-anchor="middle" font-weight="400" font-family="Georgia,'Times New Roman',serif">Results</text><line x1="508" y1="218" x2="525" y2="218" stroke="#52626b" stroke-width="1.4" marker-end="url(#arr)"/><rect x="526.0" y="192.0" width="140.0" height="52.0" rx="8" fill="#ffffff" stroke="#9aa4aa" stroke-width="1.2"></rect><text x="596.0" y="223.0" font-size="13.5" fill="#1e2b34